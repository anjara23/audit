name: CI/CD - Audit stock

# déclencheur à chaque push ou pull request sur la branche main
on:
  push:
    branches: [main, try]
  pull_request:
    branches: [main, try]
  
jobs:

  # ── ÉTAPE 1 : BUILD ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Builder l'image backend
        run: docker build -t audit-backend ./backend

      - name: Builder l'image frontend
        run: docker build -t audit-frontend ./frontend

  # ── ÉTAPE 2 : TEST ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: auditDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Installer les dépendances backend
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Attendre PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && break
            echo "En attente de PostgreSQL..."
            sleep 2
          done

      - name: Lancer le backend en arrière-plan
        env:
          # postgresql:// au lieu de postgres:// (important pour SQLAlchemy)
          DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/auditDb
        run: |
          cd backend
          # ../backend.log = racine du projet, pas dans backend/
          uvicorn main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &
          sleep 15

      # Step séparé : cat depuis la racine où le fichier est créé
      - name: Afficher les logs backend
        if: always()  # s'exécute même si le step précédent échoue
        run: cat backend.log

      - name: Tester que l'API répond
        run: |
          curl --fail http://localhost:8000/docs || exit 1
          echo " Backend est opérationnel"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Installer les dépendances frontend
        run: |
          cd frontend
          npm install
      
      - name: Vérifier que le frontend build correctement
        run: |
          cd frontend
          npm run build || exit 1
          echo "Frontend compilé"

  # ── ÉTAPE 3 : PUSH DOCKER HUB ──────────────────────────────────
  push-images:
    name: Push Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/try'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Builder et pusher l'image backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            anjara23/audit-backend:latest
            anjara23/audit-backend:${{ github.sha }}
      
      - name: Builder et pusher l'image frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            anjara23/audit-frontend:latest
            anjara23/audit-frontend:${{ github.sha }}
      
      - name: Résumé du déploiement
        run: |
          echo "   Images publiées sur Docker Hub"
          echo "   anjara23/audit-backend:latest"
          echo "   anjara23/audit-frontend:latest"
          echo "   Tag commit : ${{ github.sha }}"